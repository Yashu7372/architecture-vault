version: 4
status: canonical

source_of_truth:
  repository: Yashu7372/architecture-vault
  branch: feature/portfolio-knowledge-source-of-truth
  implementation_root: engineering-knowledge-base

responsibilities:
  architecture_vault:
    owns:
      - source-registry
      - collector-capability-manifests
      - bounded-collector-execution
      - collector-execution-evidence
      - untrusted-source-boundary
      - collectors
      - normalized-ingestion
      - raw-and-canonical-evidence
      - content-quality-gates
      - structure-recovery
      - media-indexing
      - sentence-safe-chunking
      - deduplication
      - indexes
      - retrieval-context
      - lightweight-source-graph
      - deterministic-semantic-candidates
      - evidence-backed-concept-scoring
      - extractive-gists
      - inferred-relation-candidates
      - source-authority-scoring
      - duplicate-and-near-duplicate-control
      - pdf-page-chapter-figure-provenance
      - statistical-relation-scoring
      - multi-lens-candidate-learning-units
      - bounded-context-packs
      - learning-course-builders
      - scheduled-public-refresh
      - incremental-source-state
      - candidate-knowledge-deltas
    does_not_own:
      - enterprise-control-plane-kernel
      - cross-project-scheduling-authority
      - cross-project-mutation-authority
      - final-curated-portfolio-graph
      - final-curated-concept-definitions
      - final-curated-typed-relationships
      - flagship-implementation-workflow-state
      - deterministic-implementation-verification
      - public-content-authority

  enterprise_architecture_graph:
    repository: Yashu7372/enterprise-architecture-graph
    owns:
      - curated-concepts
      - verified-typed-relationships
      - architecture-patterns
      - failure-modes
      - role-learning-paths
      - portfolio-maturity
      - reference-architecture-narrative

  flagship_implementation:
    primary_repository: Yashu7372/engineering-control-plane
    owns:
      - executable-implementation
      - engineering-evidence
      - tests
      - verification
      - runtime-observations
      - implementation-adrs

  publishing:
    consumes:
      - curated-original-knowledge
      - safe-implementation-evidence
      - original-diagrams
      - tests-and-benchmarks
      - reviewed-learning-notes
    forbidden_as_authority:
      - raw-third-party-captures
      - unreviewed-generated-summaries
      - inferred-relations-without-evidence

capability_model:
  registry: config/capabilities.yaml
  contract_version: 1
  ownership: enterprise-os-capability-plane-compatible
  collector_kind: collector
  execution_model: selected-by-source-registry-not-agent-chosen
  collector_authority:
    external_writes: forbidden
    promotion: forbidden
    canonical_knowledge_mutation: forbidden
  trust_boundary:
    default: UNTRUSTED_EXTERNAL
    content_role: data-not-instructions
    sanitization_is_security_boundary: false
    architectural_controls_are_security_boundary: true
  control_plane_relationship:
    architecture_vault_can_run_locally: true
    control_plane_future_responsibility:
      - authorize
      - schedule
      - select-execution-provider
      - enforce-resource-policy
      - observe
      - retain-cross-project-run-state
    architecture_vault_remains:
      - project-pipeline
      - capability-implementation-host
      - evidence-acquisition-and-processing-system

knowledge_spine:
  storage: output/context/context.sqlite
  schema_version: 3
  taxonomy: config/knowledge-taxonomy.yaml
  evidence_policy: config/evidence-policy.yaml
  learning_lenses: config/learning-lenses.yaml
  relation_metrics: [jaccard, pmi, npmi, tfidf_support, source_quality, source_diversity]
  duplicate_evidence_behavior: duplicate-cluster-counts-as-one-evidence-unit
  evidence_states:
    OBSERVED: explicitly present in deterministic source material
    EXTRACTED: structured directly from explicit source wording
    INFERRED: deterministic statistical or rule-based interpretation
    VERIFIED: promoted only after deterministic evidence/review requirements are satisfied
  semantic_authority: candidate-evidence-backed
  learning_unit_default:
    lenses: [learn, architect, production, failures, code, big-tech, interview, portfolio]
    target_reading_minutes: 2-3
    generation_mode: deterministic-extractive-no-llm
  invariants:
    - candidate-concepts-do-not-equal-curated-concepts
    - inferred-relations-do-not-equal-verified-relations
    - every-learning-unit-retains-source-evidence
    - source-authority-does-not-change-evidence-state
    - duplicate-copies-do-not-inflate-relation-confidence
    - negative-pmi-does-not-create-semantic-relations
    - raw-content-remains-distinct-from-canonical-content
    - collector-output-remains-untrusted-evidence

incremental_refresh:
  source_state: output/state/source-state.json
  latest_delta: output/deltas/latest.json
  run_delta_pattern: output/deltas/{run_id}.json
  execution_evidence_pattern: output/evidence/{run_id}/
  delta_authority: CANDIDATE_ONLY
  automatic_promotion: false
  change_types: [ADDED, CONTENT_CHANGED, METADATA_CHANGED, REMOVED]
  failure_behavior:
    preserve_last_good_source_snapshot: true
    failed-source-does-not-create-removals: true
    partial-source-merges-with-last-good-snapshot: true
  downstream_intent:
    - targeted-knowledge-spine-re-evaluation
    - avoid-full-rediscovery-when-only-bounded-evidence-changed

source_registry:
  manual: config/sources.manual.yaml
  generated: config/sources.generated.yaml
  groups: config/source-groups.yaml
  canonical_public_group: canonical-public
  scheduled_research_group: scheduled-public
  scheduled_course_group: daily-learning
  authenticated_group: authenticated-manual

automation:
  canonical_branch_workflow: .github/workflows/portfolio-knowledge-source-of-truth.yml
  default_branch_scheduler: .github/workflows/portfolio-knowledge-scheduled-refresh.yml
  schedule_cron_utc: "23 2 * * *"
  scheduled_course_progression:
    runner: scripts/run_daily_course_learning.py
    track: all
    lessons_per_run: 1
    state: output/scheduler/sdcourse-state.json
  raw_runtime_output_committed: false

promotion:
  from: architecture-vault
  to: Yashu7372/enterprise-architecture-graph
  requires_review: true
  requires_original_summary: true
  requires_provenance: true
  requires_relationships: true
  raw_article_body_allowed: false

invariants:
  - old-feature-branches-are-history-not-authority
  - raw-third-party-content-is-not-public-portfolio-content
  - curated-knowledge-is-distinct-from-retrieval-context
  - candidate-semantics-are-distinct-from-curated-knowledge
  - implementation-evidence-is-distinct-from-external-research
  - course-access-boundaries-remain-public-preview-or-curriculum-only
  - scheduled-authenticated-scraping-is-disabled
  - collector-capabilities-never-own-external-write-authority
  - collector-content-is-data-never-control-instruction
  - failed-refresh-never-erases-last-good-evidence
  - future-work-on-this-path-targets-the-canonical-branch
