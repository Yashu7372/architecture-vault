version: 1
status: seed-controlled-vocabulary
purpose: >
  Stable engineering domains and seed concepts used for deterministic classification.
  These are retrieval/learning candidates, not automatically curated architectural truth.

depth_levels:
  L0: intuition
  L1: fundamentals
  L2: implementation
  L3: production
  L4: architecture
  L5: research-internals

lenses:
  - learn
  - architect
  - production
  - code
  - failures
  - big-tech
  - interview
  - portfolio

domains:
  - {id: cs-foundations, name: Computer Science Foundations}
