name: Portfolio Knowledge Source of Truth

on:
  push:
    branches:
      - feature/portfolio-knowledge-source-of-truth
    paths:
      - "engineering-knowledge-base/**"
      - "PORTFOLIO_KNOWLEDGE_SYSTEM.md"
      - "README.md"
      - ".github/workflows/portfolio-knowledge-source-of-truth.yml"
  pull_request:
    branches:
      - feature/portfolio-knowledge-source-of-truth
    paths:
      - "engineering-knowledge-base/**"
      - "PORTFOLIO_KNOWLEDGE_SYSTEM.md"
      - "README.md"
      - ".github/workflows/portfolio-knowledge-source-of-truth.yml"
  workflow_dispatch:
    inputs:
      group:
        description: Source group to collect
        required: false
        default: canonical-public
      max_articles:
        description: Optional per-source article bound
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engineering-knowledge-base/requirements.txt

      - name: Install dependencies
        run: pip install -r engineering-knowledge-base/requirements.txt

      - name: Compile Python
        run: python -m compileall -q engineering-knowledge-base

      - name: Validate portfolio registry
        run: python engineering-knowledge-base/scripts/run_portfolio_knowledge_pipeline.py --validate-only

      - name: Run unit tests
        run: python -m unittest discover -s engineering-knowledge-base/tests -p "test_*.py"

  manual-refresh:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engineering-knowledge-base/requirements.txt

      - name: Install dependencies
        run: pip install -r engineering-knowledge-base/requirements.txt

      - name: Restore private runtime knowledge cache
        uses: actions/cache@v4
        with:
          path: engineering-knowledge-base/output
          key: portfolio-knowledge-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            portfolio-knowledge-${{ runner.os }}-

      - name: Refresh selected public knowledge
        shell: bash
        run: |
          python engineering-knowledge-base/scripts/run_portfolio_knowledge_pipeline.py \
            --group "${{ inputs.group }}" \
            --resume \
            --max-articles "${{ inputs.max_articles }}"

      - name: Print health summary
        if: always()
        shell: bash
        run: |
          test -f engineering-knowledge-base/output/manifest.json && \
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path("engineering-knowledge-base/output/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          print(f"documents={len(data)}")
          print("context_sqlite=" + str(Path("engineering-knowledge-base/output/context/context.sqlite").is_file()))
          PY
