name: Portfolio Knowledge Scheduled Refresh

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-knowledge-scheduled-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout canonical portfolio knowledge branch
        uses: actions/checkout@v4
        with:
          ref: feature/portfolio-knowledge-source-of-truth

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engineering-knowledge-base/requirements.txt

      - name: Install dependencies
        run: pip install -r engineering-knowledge-base/requirements.txt

      - name: Validate source-of-truth contract
        shell: bash
        run: |
          python engineering-knowledge-base/scripts/run_portfolio_knowledge_pipeline.py --validate-only
          python -m unittest discover -s engineering-knowledge-base/tests -p "test_*.py"

      - name: Restore private runtime knowledge cache
        uses: actions/cache@v4
        with:
          path: engineering-knowledge-base/output
          key: portfolio-knowledge-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            portfolio-knowledge-${{ runner.os }}-

      - name: Refresh bounded public research sources
        run: >-
          python engineering-knowledge-base/scripts/run_portfolio_knowledge_pipeline.py
          --group scheduled-public
          --resume
          --max-articles 20
          --skip-context

      - name: Advance Substack learning one lesson per track
        run: >-
          python engineering-knowledge-base/scripts/run_daily_course_learning.py
          --track all
          --lessons-per-run 1
          --rebuild-context

      - name: Verify generated context and scheduler state
        run: |
          test -f engineering-knowledge-base/output/manifest.json
          test -f engineering-knowledge-base/output/MASTER_INDEX.md
          test -f engineering-knowledge-base/output/context/context.sqlite
          test -f engineering-knowledge-base/output/context/chunks.jsonl
          test -f engineering-knowledge-base/output/context/graph.json
          test -f engineering-knowledge-base/output/scheduler/sdcourse-state.json

# GitHub cron workflows only execute from the repository default branch.
# This file intentionally lives on main but checks out the fixed canonical
# feature branch above. The knowledge implementation and source registry remain
# owned by feature/portfolio-knowledge-source-of-truth.
# Raw captures are never committed; scheduled state/output persists only through
# the Actions cache so the day-wise Substack learning scheduler can resume.
